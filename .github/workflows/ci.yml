name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # Root dev deps (vitest, typescript)
      - run: npm install --no-audit --no-fund

      # CLI build + typecheck
      - name: Install CLI deps
        run: cd packages/cli && npm install --no-audit --no-fund
      - name: Build CLI
        run: npm run build:cli

      # Determinism + redaction + drift tests
      - name: Test
        run: npm test

      # H3 — pattern drift gate (extension <-> CLI must not diverge silently)
      - name: Pattern drift check
        run: npm run check:drift
