# ============================================================
# release-please + npm publish — single workflow, human-gated.
#
# On every push to master, release-please opens/updates a "Release PR"
# that bumps the version + writes CHANGELOG.md from Conventional Commits.
# Merging that PR makes release-please create the git tag + GitHub Release
# AND sets release_created=true on the SAME run — so the build + publish
# jobs run in this same workflow. Publishing in-run avoids GitHub's
# GITHUB_TOKEN recursion limit (a Release created by GITHUB_TOKEN does not
# trigger a separate `release: published` workflow), so no PAT is needed.
#
# build   — installs, builds, uploads packages/cli/dist as an artifact.
#           NO id-token, so a compromised build step cannot mint an
#           npm publish credential.
# publish — has `id-token: write`. Does NOT install/build/test. Downloads
#           the prebuilt dist artifact and runs `npm publish --ignore-scripts`
#           via OIDC Trusted Publishing (no NPM_TOKEN). Requires npm >= 11.5.
#
# workflow_dispatch with publish=true forces build + publish without a new
# release — used to backfill a release that was created but not published.
# ============================================================
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Force build + publish the current master to npm (backfill a release that did not publish)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - id: rp
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install (clean)
        run: npm ci
        working-directory: packages/cli
      - name: Build
        run: npm run build
        working-directory: packages/cli
      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-dist
          path: packages/cli/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — required for Trusted Publishing
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for OIDC (needs >= 11.5)
        run: npm install -g npm@latest
      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-dist
          path: packages/cli/dist
      - name: Publish (OIDC Trusted Publishing — no token, no scripts)
        run: npm publish --ignore-scripts
        working-directory: packages/cli
