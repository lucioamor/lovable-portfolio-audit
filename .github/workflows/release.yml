# ============================================================
# release-please — human-gated release automation.
#
# On every push to master it opens/updates a "Release PR" that bumps the
# version + writes CHANGELOG.md from Conventional Commits. Merging that PR
# creates the git tag and a GitHub Release, which fires publish.yml.
# Nothing reaches npm until you merge the PR.
# ============================================================
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
