# ============================================================
# Publish @nxlv-ai/lovable-audit to npm via OIDC Trusted Publishing.
#
# Triggered by a published GitHub Release (created by release-please).
# Two jobs, hardened:
#   build   — installs, builds, uploads packages/cli/dist as an artifact.
#             NO id-token, so a compromised build step cannot mint an
#             npm publish credential.
#   publish — has `id-token: write`. Does NOT install/build/test. It only
#             checks out (for package.json/README/LICENSE), downloads the
#             prebuilt dist artifact, and runs `npm publish --ignore-scripts`.
#
# No NPM_TOKEN / NODE_AUTH_TOKEN anywhere — the OIDC identity + the npm
# Trusted Publisher config authorize the publish. Requires npm >= 11.5.
# ============================================================
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install (clean)
        run: npm ci
        working-directory: packages/cli
      - name: Build
        run: npm run build
        working-directory: packages/cli
      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-dist
          path: packages/cli/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — required for Trusted Publishing
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for OIDC (needs >= 11.5)
        run: npm install -g npm@latest
      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-dist
          path: packages/cli/dist
      - name: Publish (OIDC Trusted Publishing — no token, no scripts)
        run: npm publish --ignore-scripts
        working-directory: packages/cli
